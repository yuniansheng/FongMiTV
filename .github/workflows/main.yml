name: FongMi TV Build

on:
  workflow_dispatch:
  push:
    branches:
      - release

jobs:
  build:
    name: Build TV APK
    runs-on: ubuntu-latest

    env:
      KEYSTORE_FILE: keystore.jks
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > app/keystore.jks

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant gradlew permission
        run: chmod +x gradlew

      - name: Build Leanback ARM64 Release
        run: ./gradlew :app:assembleLeanbackArm64_v8aRelease

      - name: Build Mobile ARM64 Release
        run: ./gradlew :app:assembleMobileArm64_v8aRelease

      - name: Upload Leanback APK
        uses: actions/upload-artifact@v4
        with:
          name: FongMiTV-Leanback-ARM64
          path: app/build/outputs/apk/leanbackArm64_v8a/release/*.apk

      - name: Upload Mobile APK
        uses: actions/upload-artifact@v4
        with:
          name: FongMiTV-Mobile-ARM64
          path: app/build/outputs/apk/mobileArm64_v8a/release/*.apk
