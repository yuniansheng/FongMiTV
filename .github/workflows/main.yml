name: FongMi TV Build

on:
  workflow_dispatch:
  push:
    branches:
      - release

jobs:
  build:
    name: Build TV APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant gradlew permission
        run: chmod +x gradlew

      - name: Build Leanback ARM64 Release
        run: ./gradlew :app:assembleLeanbackArm64_v8aRelease

      - name: Build Mobile ARM64 Release
        run: ./gradlew :app:assembleMobileArm64_v8aRelease

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: FongMiTV-ARM64
          path: |
            app/build/outputs/apk/leanbackArm64_v8a/release/*.apk
            app/build/outputs/apk/mobileArm64_v8a/release/*.apk
